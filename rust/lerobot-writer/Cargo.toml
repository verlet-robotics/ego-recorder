[package]
name = "lerobot-writer"
version = "0.1.0"
edition.workspace = true

[dependencies]
egorec = { path = "../egorec" }
ffmpeg-next = "7"
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
