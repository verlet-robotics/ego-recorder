[package]
name = "ego-qc"
version = "0.1.0"
edition.workspace = true

[dependencies]
egorec = { path = "../egorec" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
ffmpeg-next = "7"
indicatif = "0.17"
