[package]
name = "egorec"
version = "0.1.0"
edition.workspace = true

[dependencies]
zdepth-sys = { path = "../zdepth-sys" }
ffmpeg-next = "7"
byteorder = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitvec = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
