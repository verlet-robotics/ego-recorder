[package]
name = "ego-recorder-app"
version = "0.1.0"
description = "Ego Recorder — unified desktop app for recording, reviewing, and uploading .egorec files"
edition = "2021"

[lib]
name = "ego_recorder_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
egorec = { path = "../../rust/egorec" }
lerobot-writer = { path = "../../rust/lerobot-writer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
walkdir = "2"
rfd = "0.15"
thiserror = "2"
axum = "0.8"
async-stream = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt", "io"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
urlencoding = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
dotenvy = "0.15"
notify = "7"
zbus = "5"
nix = { version = "0.29", features = ["fs", "signal", "process"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-smithy-types = "1"
bytes = "1"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
byteorder = "1"

[profile.dev]
opt-level = 1
