# 50-ego-recorder-lid.conf
# Install to: /etc/systemd/logind.conf.d/50-ego-recorder-lid.conf
#
# Fallback for lid-close prevention. The D-Bus inhibitor lock in
# src/presenter/headless_presenter.cpp is the PREFERRED approach -- it is
# process-scoped (releases automatically on process exit) and causes no
# side effects on other sessions.
#
# This file is MACHINE-WIDE and should only be used if the D-Bus inhibitor
# lock fails (e.g., running on a system without a D-Bus session bus).
# Remove this file if the D-Bus inhibitor is confirmed working.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
